<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BerryCade</title>
<link rel="icon" href="/static/img/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/logo-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/img/logo-192.png">
<link rel="apple-touch-icon" href="/static/img/logo-180.png">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="login" class="hidden">
  <form class="login-box" id="login-form" autocomplete="on">
    <h1><img class="brand-logo" src="/static/img/logo-192.png" alt="">BerryCade</h1>
    <div class="sub">Acesso administrativo</div>
    <div id="login-err" class="errbox hidden"></div>
    <div class="form" style="grid-template-columns:1fr">
      <input class="in" name="username" placeholder="Usuário" autocomplete="username" required autofocus>
      <input class="in" name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
      <button class="btn primary" style="justify-content:center;padding:8px">Entrar</button>
    </div>
  </form>
</div>

<div id="app" class="hidden">
  <header id="topbar">
    <button class="tb-btn" id="burger" aria-label="Menu">☰</button>
    <div class="title"><img class="brand-logo" src="/static/img/logo-64.png" alt="">BerryCade</div>
    <div class="host" id="tb-host"></div>
    <div class="spacer"></div>
    <button class="tb-btn" id="tb-theme" title="Tema claro/escuro">◐</button>
    <button class="tb-btn" id="tb-user"></button>
  </header>
  <nav id="sidebar"><div id="nav-list"></div><div id="nav-foot"></div></nav>
  <main id="main">
    <div id="pending" class="hidden"></div>
    <div id="view"></div>
  </main>
  <footer id="statusbar">
    <span id="sb-sync"></span>
    <span id="sb-sessions"></span>
    <span class="spacer"></span>
    <span id="sb-updated"></span>
  </footer>
</div>
<div id="toasts"></div>

<script src="/static/js/core.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/pages/dashboard.js"></script>
<script src="/static/js/pages/network.js"></script>
<script src="/static/js/pages/policy.js"></script>
<script src="/static/js/pages/security.js"></script>
<script src="/static/js/pages/secprofiles.js"></script>
<script src="/static/js/pages/vpn.js"></script>
<script src="/static/js/pages/logs.js"></script>
<script src="/static/js/pages/system.js"></script>
<script src="/static/js/pages/firmware.js"></script>
<script src="/static/js/pages/wifi.js"></script>
<script src="/static/js/setup.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
